name: science-workbench-local

x-stub-environment: &stub-environment
  APP_ORIGIN: http://localhost:${SWB_WEB_PORT:-53000}
  ARTIFACT_ORIGIN: http://127.0.0.1:${SWB_MINIO_PORT:-59000}
  COOKIE_DOMAIN: ""
  OBJECT_STORE_DRIVER: s3
  OBJECT_STORE_ENDPOINT: http://minio:9000
  MAIL_DRIVER: mailpit
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  HOST_IP: 127.0.0.1
  SERVICE_BIND_HOST: 0.0.0.0

x-stub-service: &stub-service
  build:
    context: .
    dockerfile: infra/local/Dockerfile.stub
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    shm_size: ${SWB_POSTGRES_SHM_SIZE:-64mb}
    environment:
      POSTGRES_DB: science_workbench
      POSTGRES_USER: science_workbench
      POSTGRES_PASSWORD: local-only-postgres
      PGDATA: ${SWB_POSTGRES_PGDATA:-/var/lib/postgresql/18/docker}
    ports:
      - "127.0.0.1:${SWB_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U science_workbench -d science_workbench"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8.2.7-alpine@sha256:223b183cbc49f5ff48728e1fc52ccf101f05072decad2bd9867281a3c9bf75fd
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${SWB_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-secret
    ports:
      - "127.0.0.1:${SWB_MINIO_PORT:-59000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    platform: linux/amd64
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 5s
      timeout: 4s
      retries: 36

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
    ports:
      - "127.0.0.1:${SWB_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${SWB_MAILPIT_PORT:-58025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8025/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    <<: *stub-service
    environment:
      <<: *stub-environment
      SERVICE_ROLE: api
      SERVICE_PORT: "8000"
    ports:
      - "127.0.0.1:${SWB_API_PORT:-58000}:8000"
    depends_on:
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    <<: *stub-service
    environment:
      <<: *stub-environment
      SERVICE_ROLE: worker
      SERVICE_PORT: "8001"
    ports:
      - "127.0.0.1:${SWB_WORKER_PORT:-58001}:8001"
    depends_on:
      clamav:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8001/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    image: nginx:1.29.5-alpine@sha256:1eff5a5f3fcf8431a0abb7eddf5471fec24e5e1905a2581aeacdb07a4479b92b
    ports:
      - "127.0.0.1:${SWB_WEB_PORT:-53000}:8080"
    volumes:
      - ./infra/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-client:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
