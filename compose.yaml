name: science-workbench-local

x-stub-environment: &stub-environment
  APP_ORIGIN: http://localhost:${SWB_WEB_PORT:-53000}
  ARTIFACT_ORIGIN: http://127.0.0.1:${SWB_MINIO_PORT:-59000}
  COOKIE_DOMAIN: ""
  OBJECT_STORE_DRIVER: s3
  OBJECT_STORE_ENDPOINT: http://minio:9000
  MAIL_DRIVER: mailpit
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  HOST_IP: 127.0.0.1
  SERVICE_BIND_HOST: 0.0.0.0

x-stub-service: &stub-service
  build:
    context: .
    dockerfile: infra/local/Dockerfile.stub
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: science_workbench
      POSTGRES_USER: science_workbench
      POSTGRES_PASSWORD: local-only-postgres
    ports:
      - "127.0.0.1:${SWB_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U science_workbench -d science_workbench"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8.2.7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${SWB_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-secret
    ports:
      - "127.0.0.1:${SWB_MINIO_PORT:-59000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  clamav:
    image: clamav/clamav:1.4.3
    platform: linux/amd64
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 5s
      timeout: 4s
      retries: 36

  mailpit:
    image: axllent/mailpit:v1.27.8
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
    ports:
      - "127.0.0.1:${SWB_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${SWB_MAILPIT_PORT:-58025}:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8025/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    <<: *stub-service
    environment:
      <<: *stub-environment
      SERVICE_ROLE: api
      SERVICE_PORT: "8000"
    ports:
      - "127.0.0.1:${SWB_API_PORT:-58000}:8000"
    depends_on:
      clamav:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    <<: *stub-service
    environment:
      <<: *stub-environment
      SERVICE_ROLE: worker
      SERVICE_PORT: "8001"
    ports:
      - "127.0.0.1:${SWB_WORKER_PORT:-58001}:8001"
    depends_on:
      clamav:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8001/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  web:
    image: nginx:1.29.5-alpine
    ports:
      - "127.0.0.1:${SWB_WEB_PORT:-53000}:8080"
    volumes:
      - ./infra/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-client:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  mailpit-data:
