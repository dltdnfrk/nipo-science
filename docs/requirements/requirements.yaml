  "requirements": {
    "L01": {"kind": "feature", "priority": "P0", "statement": "Single-user local installation with a fixed local identity, an owner-only data root outside implicitly synced directories, and no listener bound beyond loopback."},
    "L02": {"kind": "feature", "priority": "P0", "statement": "Persistent local Projects and Sessions with list, resume, and archive that survive restart."},
    "L03": {"kind": "feature", "priority": "P0", "statement": "A real measurement file loads into a typed scientific input with declared units, calibration, and data origin; malformed input is refused with the science package's own issue codes before any Artifact exists."},
    "L04": {"kind": "feature", "priority": "P0", "statement": "A complete ResearchIntent and an immutable one-use ActionPlan approval bound to its canonical digest."},
    "L05": {"kind": "feature", "priority": "P0", "statement": "Deterministic Python execution whose actual isolation level is disclosed as an explicit field on every durable record it produces."},
    "L06": {"kind": "feature", "priority": "P0", "statement": "Immutable content-addressed Artifact Versions committed by compare-and-swap against an exact base Version."},
    "L07": {"kind": "feature", "priority": "P0", "statement": "Provenance pinning input, intent, code, environment, and producing execution, independently recomputable from the artifacts and the pinned toolchain alone."},
    "L08": {"kind": "feature", "priority": "P0", "statement": "Durable Run records whose truncation is detectable, with a produced-execution identity that publishes at most one chain."},
    "L09": {"kind": "feature", "priority": "P0", "statement": "Local provider registry and credential custody with explicit provider and model selection."},
    "L10": {"kind": "feature", "priority": "P0", "statement": "A model turn bound to the selected provider and model with no automatic fallback."},
    "L11": {"kind": "feature", "priority": "P0", "statement": "A persisted trace-only Reviewer over pinned evidence implementing RV01-RV05."},
    "L12": {"kind": "feature", "priority": "P0", "statement": "A version-pinned Export Pack with manifest, checksums, provenance, ActionPlan, pinned ResearchIntent digest, and Review status."},

    "AC-L01": {"kind": "acceptance", "priority": "release", "statement": "A fresh install creates an owner-only data root outside any implicitly synced directory, binds no socket outside loopback, and offers no configuration, environment variable, or flag that enables remote access; a cross-origin state-changing request to the local interface is rejected."},
    "AC-L02": {"kind": "acceptance", "priority": "release", "statement": "A Project and Session created before restart list and resume after restart with ordered history, archive blocks further writes, and a Session link cannot be created for a Session that does not exist."},
    "AC-L03": {"kind": "acceptance", "priority": "release", "statement": "A real measurement file with declared units and calibration loads into the typed input and analyses; a file missing units, missing calibration, or malformed is refused with the science package's own issue code and creates no Artifact, no Version, and no Run record in a publishable state."},
    "AC-L04": {"kind": "acceptance", "priority": "release", "statement": "An incomplete ResearchIntent is rejected at every boundary; an accepted intent fixes the plan digest; and a mutated, expired, replayed, or already-consumed approval is rejected with zero execution side effects while approval consumption and execution start commit together."},
    "AC-L05": {"kind": "acceptance", "priority": "release", "statement": "An approved plan executes deterministic Python and produces the CSV, PNG, Markdown, and evidence-ledger Versions in chain order."},
    "AC-L05-B": {"kind": "acceptance", "priority": "release", "statement": "Every durable execution record carries the isolation level as an explicit field whose current value is in_process; no product surface, document, or artifact describes that execution as sandboxed or confined; and any isolation claim that is added is accompanied by an outcome test demonstrating the specific denial it names."},
    "AC-L06": {"kind": "acceptance", "priority": "release", "statement": "Committing from Version 1 creates Version 2 while Version 1's bytes, digest, and metadata are unchanged, and identical content across Projects is stored once."},
    "AC-L06-B": {"kind": "acceptance", "priority": "release", "statement": "A stale base version, a payload contradicting its digest, a contradictory size, a foreign object key, a duplicate Version identifier, and unsorted, duplicated, or unresolvable lineage are each rejected without any write, and no failure path deletes content."},
    "AC-L07": {"kind": "acceptance", "priority": "release", "statement": "Every Version records input, intent, code, environment, and producing-execution provenance, and the evidence ledger pins the digests the store actually holds."},
    "AC-L07-B": {"kind": "acceptance", "priority": "release", "statement": "A verifier holding only the exported artifacts and the pinned toolchain recomputes the input digest, the intent digest, the code digest, the environment digest, and every artifact digest and reaches the recorded values, trusting no statement the run made about itself; a digest that cannot be recomputed independently fails the check."},
    "AC-L08": {"kind": "acceptance", "priority": "release", "statement": "A chain interrupted at any point leaves a failed Run record naming exactly the outputs committed so far, a reader distinguishes it from a completed chain without re-execution, and a second publication attempt under the same produced-execution identity is refused."},
    "AC-L09": {"kind": "acceptance", "priority": "release", "statement": "A provider key stored through the registry round-trips byte-exact, is ciphertext-only at rest, cannot be decrypted into another provider's slot, and a corrupt store or an unreadable master key is reported loudly rather than silently discarded or overwritten."},
    "AC-L09-B": {"kind": "acceptance", "priority": "release", "statement": "No key material appears in any listing, on-disk file, repr, exception message, process argument list, log, Artifact, Run record, Export, or model context; a credential read failure is not reported as absence and never falls through to another source; and status is resolved without decrypting or unlocking."},
    "AC-L10": {"kind": "acceptance", "priority": "release", "statement": "A model turn uses exactly the provider and model the researcher selected and persists that selection with the Run; quota, authentication, cancellation, unavailability, and terminal failure surface as provider-neutral states without selecting another provider, model, or credential, and leave existing Artifact Versions unchanged."},
    "AC-L11": {"kind": "acceptance", "priority": "release", "statement": "A persisted Review over pinned Versions catches a numeric claim absent from pinned output, an identifier that does not support its claim, and a figure that does not correspond to its pinned input, code, and output digests, and submits findings exactly once."},
    "AC-L11-B": {"kind": "acceptance", "priority": "release", "statement": "Every attempt by the Reviewer to execute Python, execute a shell, invoke a Runner, call a connector, execute a tool, open a network connection, write or update an Artifact Version, or cause re-execution is rejected without creating an execution or changing an Artifact; and evidence that is missing, unreachable, or uncheckable yields inconclusive rather than pass."},
    "AC-L12": {"kind": "acceptance", "priority": "release", "statement": "An Export Pack contains the selected CSV, PNG, Markdown, ledger, manifest, checksums, provenance, ActionPlan, pinned ResearchIntent digest, and Review status, and verifies independently from the pack alone."},
    "AC-L12-B": {"kind": "acceptance", "priority": "release", "statement": "Export refuses to produce a pack, rather than sanitizing, for an absolute or drive-qualified path, a backslash, a dot or dotdot segment, a segment ending in a dot, a reserved device name, a link entry, an NFKC-casefold collision, a directory-prefix collision, a reserved pack root, an unsorted or non-unique selection, a selection unequal to the exported entries, or any credential material."},
    "AC-SAFE": {"kind": "acceptance", "priority": "release", "statement": "Clinical, diagnostic, patient-care, regulated-pathogen-procedure, and irreversible wet-lab requests stop or remain bounded research support; insufficient_data, inconclusive, and refusal are produced instead of a fabricated diagnosis, measurement, or citation; and the research-only non-clinical notice is presented with the time the researcher acknowledged it."},
    "AC-DETERMINISM": {"kind": "acceptance", "priority": "release", "statement": "Three runs of the same scientific input and the same ResearchIntent in separate interpreter processes with differing hash seeds produce byte-identical CSV, PNG, and Markdown, and evidence ledgers identical except for their execution-bound fields."},
    "AC-LOCAL": {"kind": "acceptance", "priority": "release", "statement": "With the network observed, no research content, artifact byte, provenance digest, credential, or usage record leaves the machine except in the model turn the researcher explicitly initiated to the provider they selected; there is no telemetry, analytics, crash upload, update beacon, or implicit cloud sync of the data root."},

    "LS01": {"kind": "security", "priority": "P0", "statement": "No listener is bound beyond loopback, cross-origin state-changing requests are rejected, and the local session credential is required and is not derivable from readable data-root metadata."},
    "LS02": {"kind": "security", "priority": "P0", "statement": "Provider credentials are ciphertext-only at rest under a Keychain-held 32-byte master key and are sealed with AES-256-GCM using the provider identifier as additional authenticated data."},
    "LS03": {"kind": "security", "priority": "P0", "statement": "No secret appears in a log, exception message, repr, process argument list, Artifact, Run record, Export, or model context."},
    "LS04": {"kind": "security", "priority": "P0", "statement": "Execution isolation is disclosed as an explicit field and is never overstated; no confinement guarantee is claimed without an outcome test of the specific denial."},
    "LS05": {"kind": "security", "priority": "P0", "statement": "Input parsing is bounded and never executes input: no code evaluation, no executable deserialization, and no archive expansion without declared entry-count and output-size bounds."},
    "LS06": {"kind": "security", "priority": "P0", "statement": "File content, retrieved text, and model output remain untrusted data and cannot be promoted to instruction."},
    "LS07": {"kind": "security", "priority": "P0", "statement": "Export and file paths reject absolute paths, traversal, links, reserved roots, directory-prefix collisions, and NFKC-casefold-normalized collisions."},
    "LS08": {"kind": "security", "priority": "P0", "statement": "Every data-root file holding a secret or private research content is owner-only from the instant it first exists and is never created readable and tightened afterwards."},
    "LS09": {"kind": "security", "priority": "P0", "statement": "Every blob read verifies content against its recorded digest and fails loudly on mismatch without returning bytes."},
    "LS10": {"kind": "security", "priority": "P0", "statement": "Egress is limited to the provider endpoint the researcher selected; there is no telemetry, analytics, crash upload, update beacon, or implicit cloud sync of the data root."},

    "LN01": {"kind": "nonfunctional", "priority": "release", "statement": "Cold start to an interactive state is at most five seconds and single-modality analysis P95 is at most ten seconds on a supported Mac."},
    "LN02": {"kind": "nonfunctional", "priority": "release", "statement": "Three runs of the same input and intent in separate interpreter processes with differing hash seeds produce byte-identical CSV, PNG, and Markdown."},
    "LN03": {"kind": "nonfunctional", "priority": "release", "statement": "Artifact read checksum mismatches are zero."},
    "LN04": {"kind": "nonfunctional", "priority": "release", "statement": "A process killed at any point in the chain leaves a Run record a reader cannot mistake for complete, and restart reconciles state within five seconds without replaying a side effect."},
    "LN05": {"kind": "nonfunctional", "priority": "release", "statement": "An Export Pack up to 500 MiB completes within five minutes and verifies independently."},
    "LN06": {"kind": "nonfunctional", "priority": "release", "statement": "Copying the data root to another machine with the same pinned toolchain reproduces every read and every recorded digest."},
    "LN07": {"kind": "nonfunctional", "priority": "release", "statement": "When a graphical interface is present the P0 flow is keyboard-complete with zero serious automated WCAG 2.2 AA violations."},
    "LN08": {"kind": "nonfunctional", "priority": "release", "statement": "With no network available every stage except the model turn completes, and network loss never corrupts an Artifact Version or silently changes the selected provider."},

    "GL01": {"kind": "golden_run", "priority": "release", "statement": "The reference spectrum produces four Artifact Versions with the expected digests."},
    "GL02": {"kind": "golden_run", "priority": "release", "statement": "An input missing calibration or units terminates as insufficient_data with no Artifact Version asserting a conclusion."},
    "GL03": {"kind": "golden_run", "priority": "release", "statement": "Probe analysis separates molecular, optical, and experimental-artifact hypotheses and states no diagnosis."},
    "GL04": {"kind": "golden_run", "priority": "release", "statement": "A correction produces Version 2 while Version 1's bytes and digest are unchanged."},
    "GL05": {"kind": "golden_run", "priority": "release", "statement": "A chain killed mid-publish is readable as failed with exactly the outputs committed so far."},
    "GL06": {"kind": "golden_run", "priority": "release", "statement": "The Reviewer catches a numeric overstatement and an unsupported identifier and returns inconclusive for evidence it cannot reach."},
    "GL07": {"kind": "golden_run", "priority": "release", "statement": "An Export Pack verifies independently and contains no credential material."},
    "GL08": {"kind": "golden_run", "priority": "release", "statement": "A prompt-injection payload embedded in an input file or a retrieved source is never promoted to instruction."},

    "RV01": {"kind": "review_rule", "priority": "P0", "statement": "Every numeric claim exists in pinned execution output or pinned source evidence."},
    "RV02": {"kind": "review_rule", "priority": "P0", "statement": "Every cited identifier resolves and supports its claim; when the machine is offline or the identifier cannot be checked the finding is inconclusive, never pass."},
    "RV03": {"kind": "review_rule", "priority": "P0", "statement": "Tables and figures correspond to the pinned input, code, and output digests."},
    "RV04": {"kind": "review_rule", "priority": "P0", "statement": "The stated evidence level never exceeds the level of the evidence actually retrieved."},
    "RV05": {"kind": "review_rule", "priority": "P0", "statement": "Output respects the research-only, non-clinical, and safety limits."}
  }
}
