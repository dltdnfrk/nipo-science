  <rect x="1104" y="414" width="118" height="38" rx="7" fill="#dfe8d7"/><text x="1130" y="439" fill="#234332" font-family="Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="700">승인 완료</text>
