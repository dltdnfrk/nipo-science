<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960" role="img" aria-labelledby="title desc">
  <title id="title">광물 노트북 연구 워크벤치 데스크톱 콘셉트</title>
  <desc id="desc">프로젝트 탐색, 실행 타임라인, 아티팩트와 검토 근거를 한 화면에 배치한 한국어 연구 워크벤치 디자인 참조</desc>
  <rect width="1536" height="960" fill="#f3f0e7"/>
  <rect x="24" y="24" width="1488" height="912" rx="18" fill="#fbfaf5" stroke="#263b31" stroke-width="2"/>
  <rect x="24" y="24" width="232" height="912" rx="18" fill="#23352d"/>
  <text x="54" y="76" fill="#f7f1df" font-family="Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700">연구 워크벤치</text>
  <text x="54" y="112" fill="#b9c8bd" font-family="Apple SD Gothic Neo, sans-serif" font-size="13">비진단 연구 지원 · 서울</text>
  <g font-family="Apple SD Gothic Neo, sans-serif" font-size="15">
    <rect x="42" y="150" width="196" height="44" rx="8" fill="#dfe8d7"/>
    <text x="60" y="178" fill="#1f3429" font-weight="700">실행 기록</text>
    <text x="60" y="230" fill="#dfe8d7">프로젝트</text>
    <text x="60" y="274" fill="#dfe8d7">아티팩트</text>
    <text x="60" y="318" fill="#dfe8d7">검토 결과</text>
    <text x="60" y="362" fill="#dfe8d7">내보내기</text>
    <text x="60" y="406" fill="#dfe8d7">제공자 설정</text>
  </g>
  <line x1="280" y1="98" x2="1480" y2="98" stroke="#c9c5b7"/>
  <text x="296" y="64" fill="#24372e" font-family="Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="700">프로젝트 / 스펙트럼 보정 실험</text>
  <text x="296" y="130" fill="#23352d" font-family="Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="700">보정 스펙트럼 실행 기록</text>
  <text x="296" y="160" fill="#68736c" font-family="Apple SD Gothic Neo, sans-serif" font-size="14">입력부터 승인, 격리 실행, 근거 검토, 내보내기까지 한 흐름으로 추적합니다.</text>
