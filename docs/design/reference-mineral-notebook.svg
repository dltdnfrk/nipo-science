  <text x="1120" y="786" fill="#5c5140" font-family="Apple SD Gothic Neo, sans-serif" font-size="12">두 번째 피크의 보정 근거를 확인하세요.</text>
  <rect x="1314" y="832" width="134" height="38" rx="7" fill="#23352d"/><text x="1336" y="857" fill="#ffffff" font-family="Apple SD Gothic Neo, sans-serif" font-size="13" font-weight="700">내보내기 준비</text>
