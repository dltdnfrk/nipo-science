name: science-workbench-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: make bootstrap
      - run: make ci-local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checksummed-ci-evidence
          path: .ci/evidence/latest
