server {
    listen 8080;
    server_name _;

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /preview {
        add_header Content-Type text/plain;
        return 200 'artifact preview origin isolation';
    }

    location = /session-cookie {
        add_header Set-Cookie 'sw_session=local-only; Path=/; HttpOnly; SameSite=Strict';
        return 204;
    }
}
