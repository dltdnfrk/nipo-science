<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nipo Science — Nipo Labs의 추적 가능한 AI science Research OS">
  <meta name="product-provider-authorization-policy" content="__PRODUCT_PROVIDER_AUTHORIZATION_POLICY__">
  <title>Nipo Science</title>
  <link rel="icon" href="/product/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/product/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <div class="app-shell">
    <aside class="global-nav" aria-label="주요 탐색">
      <a class="brand" href="/workspace" aria-label="Nipo Science 워크스페이스">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <path d="M10 11.5 20 6l10 5.5v17L20 34 10 28.5z" fill="none" stroke="currentColor" stroke-width="1.5" />
          <path d="M10 11.5 20 17l10-5.5M20 17v17" fill="none" stroke="currentColor" stroke-width="1.5" />
          <circle cx="10" cy="11.5" r="2.5" fill="currentColor" />
          <circle cx="30" cy="11.5" r="2.5" fill="currentColor" />
          <circle cx="20" cy="34" r="2.5" fill="currentColor" />
          <circle cx="20" cy="17" r="2.5" fill="currentColor" />
        </svg>
        <span class="brand-copy">
          <span class="brand-kicker">NIPO LABS</span>
          <span>Nipo Science</span>
        </span>
      </a>
      <nav aria-label="제품 메뉴">
        <p class="nav-section-label">연구 공간</p>
        <ul>
          <li>
            <a data-route="/workspace" href="/workspace" aria-label="워크스페이스">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
              <span class="nav-item-label">워크스페이스</span>
            </a>
          </li>
          <li>
            <a data-route="/upload" href="/upload" aria-label="새 연구">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 13V3m0 0L6.5 6.5M10 3l3.5 3.5M4 11.5v4A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>
              <span class="nav-item-label">새 연구</span>
            </a>
          </li>
          <li>
            <a data-route="/artifacts" href="/artifacts" aria-label="아티팩트">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m10 2 7 3.5-7 3.5-7-3.5L10 2Zm-7 7 7 3.5L17 9M3 12.5 10 16l7-3.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>
              <span class="nav-item-label">아티팩트</span>
            </a>
          </li>
          <li>
            <a data-route="/settings/providers" href="/settings/providers" aria-label="연결">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M7.25 12.75 5.5 14.5a2.12 2.12 0 0 1-3-3l3-3a2.12 2.12 0 0 1 3 0M12.75 7.25l1.75-1.75a2.12 2.12 0 0 1 3 3l-3 3a2.12 2.12 0 0 1-3 0M6.5 13.5l7-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>
              <span class="nav-item-label">연결</span>
            </a>
          </li>
        </ul>
        <span class="mobile-nav-hint" aria-hidden="true">좌우로 더 보기</span>
      </nav>
      <div class="organization-card nav-context" aria-label="현재 조직">
        <span class="organization-label">조직</span>
        <span class="organization-status" id="organization-name" role="status">조직 정보 불러오는 중</span>
      </div>
    </aside>
    <div class="workspace-frame">
      <header class="workspace-bar" aria-label="현재 작업공간">
        <div class="workspace-bar__context">
          <span class="workspace-bar__eyebrow">NIPO SCIENCE / CONTROL ROOM</span>
          <span class="workspace-bar__title">Research OS</span>
        </div>
        <div class="workspace-bar__actions">
            <a class="workspace-action" href="/upload" aria-label="새 연구 시작">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" /></svg>
            <span>새 연구 시작</span>
          </a>
        </div>
      </header>
      <main id="main-content" class="main-scroll" tabindex="-1">
        <div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
        <div id="error-region" class="inline-error" role="alert" hidden></div>
        <div id="screen" aria-busy="true"><h1>Nipo Science 불러오는 중</h1></div>
      </main>
    </div>
  </div>
  <noscript><p class="noscript">이 화면을 사용하려면 JavaScript를 활성화해야 합니다.</p></noscript>
  <script src="/product/app.js" defer></script>
</body>
</html>
