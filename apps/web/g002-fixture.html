<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>G002 건식 실험 연구용 Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 2rem; max-width: 52rem; }
    button { font: inherit; padding: .5rem 1rem; } .error { color: #a40000; } code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>G002 건식 실험 연구용 Fixture</h1>
    <p>이 페이지는 외부 연결 없이 고정된 보정 CSV를 처리하는 연구 전용 시연입니다.</p>
    <button id="run-fixture" type="button">Fixture 실행</button>
    <p id="fixture-status" role="status" aria-live="polite">준비됨</p>
    <h2>단계</h2>
    <ol id="fixture-stages" aria-label="실행 단계"></ol>
    <h2>결과</h2>
    <section id="fixture-results" aria-live="polite"></section>
  </main>
  <script>
    (() => {
      const button = document.querySelector("#run-fixture");
      const status = document.querySelector("#fixture-status");
      const stages = document.querySelector("#fixture-stages");
      const results = document.querySelector("#fixture-results");
      const csv = "sample,value,calibration\nA,1.25,fixture-cal-1\nB,2.5,fixture-cal-1\n";
      const researchIntent = {
        question: "보정된 관측값을 재현 가능하게 정규화할 수 있는가?",
        rationale: "반복 분석에서 입력 순서가 결과를 바꾸지 않도록 확인한다.",
        intended_benefit: "검증 가능한 정규화 기준선을 만든다.",
        success_criteria: ["동일 입력은 동일 체크섬을 만든다."],
        constraints: ["비임상 연구 데이터만 사용한다."],
        stop_conditions: ["보정 메타데이터가 없으면 중단한다."],
        research_mode: "bounded_agentic",
        data_origin: "observed",
      };
      const show = (label) => { const item = document.createElement("li"); item.textContent = label; stages.append(item); };
      const request = async (path, body) => {
        const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.code || "fixture-failed");
        return data;
      };
      button.addEventListener("click", async () => {
        button.disabled = true; stages.replaceChildren(); results.replaceChildren(); status.className = ""; status.textContent = "실행 중";
        try {
          const uploaded = await request("/api/fixture/upload", { filename: "calibrated.csv", csv }); show("업로드 완료");
          const plan = await request("/api/fixture/plan", { lease_id: "fresh", research_intent: researchIntent }); show("연구헌장 고정 및 계획 생성 완료");
          const approval = await request("/api/fixture/approve", { plan_digest: plan.digest }); show("승인 완료");
          const executed = await request("/api/fixture/execute", { token: approval.token }); show("격리 실행 완료");
          const reviewed = await request("/api/fixture/review", {}); show("검토 완료");
          const exported = await request("/api/fixture/export", {}); show("내보내기 완료");
          const cleaned = await request("/api/fixture/cleanup", {}); show("정리 완료");
          const heading = document.createElement("p"); heading.textContent = `검토: ${reviewed.verdict}; 내보내기: ${exported.manifest_sha256}; 정리: ${cleaned.removed_runtime_data}`; results.append(heading);
          const list = document.createElement("ul");
          executed.artifacts.forEach((artifact) => { const item = document.createElement("li"); item.innerHTML = `<strong>${artifact.name}</strong> <code>${artifact.sha256}</code>`; list.append(item); });
          results.append(list); status.textContent = `완료: ${uploaded.filename}`;
        } catch (error) {
          status.className = "error"; status.textContent = `실패: ${error.message}`;
        } finally { button.disabled = false; }
      });
    })();
  </script>
</body>
</html>
